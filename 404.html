<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Página no encontrada — Café Bar Ranqui</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/ranqui-carballo-web/assets/img/logo/icon-96.png" type="image/png">
<link rel="apple-touch-icon" href="/ranqui-carballo-web/assets/img/logo/icon-180.png">
<meta name="theme-color" content="#241611">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Domine:wght@600&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/ranqui-carballo-web/css/style.css?v=1">
<style>
  /* Deliberadamente pequeño y autocontenido — GitHub Pages sirve este
     archivo para cualquier ruta que no exista, así que todos los enlaces y
     assets usan la ruta absoluta /ranqui-carballo-web/... en vez de
     relativa. Si el sitio pasa a un dominio propio, actualizar estas rutas
     igual que el resto de URLs absolutas del sitio. */
  body { display: flex; min-height: 100vh; }
  .notfound { margin: auto; max-width: 32rem; padding: 3rem 1.5rem; text-align: center; }
  .notfound-mark { width: 56px; height: 56px; margin: 0 auto 1.75rem; border-radius: 50%; }
  .notfound-code { font-family: var(--sans); font-size: 0.85rem; font-weight: 600; color: var(--cobre-tenue); letter-spacing: 0.1em; text-transform: uppercase; }
  .notfound h1 {
    margin-top: 0.75rem;
    font-family: var(--display);
    font-size: clamp(1.9rem, 5vw, 2.8rem);
    font-weight: 600;
    line-height: 1.1;
  }
  .notfound p { margin-top: 1.1rem; color: var(--crema-tenue); font-size: 1.05rem; line-height: 1.6; }
  .notfound-actions { margin-top: 2.25rem; display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; }
</style>
</head>
<body>
  <main class="notfound">
    <img class="notfound-mark" src="/ranqui-carballo-web/assets/img/logo/icon-96.png" alt="" width="56" height="56">
    <p class="notfound-code">Error 404</p>
    <h1>Este remolino se pierde aquí.</h1>
    <p>
      La página que buscas no existe o se ha movido. Vuelve al inicio, o
      pásate directamente por la franja del día.
    </p>
    <div class="notfound-actions">
      <a class="btn btn-primary" href="/ranqui-carballo-web/"><span>Volver al inicio</span></a>
      <a class="btn btn-ghost" href="/ranqui-carballo-web/#franja"><span>Ver la franja del día</span></a>
    </div>
  </main>
</body>
</html>
